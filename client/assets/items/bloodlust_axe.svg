    <!-- Wooden Handle -->
    <rect x="29" y="10" width="6" height="50" rx="3" fill="#5d4037" stroke="#111111" stroke-width="3"/>
    <!-- Blade Head (Double Beveled Heavy Axe) -->
    <path d="M35 12 C44 6 54 8 58 18 C56 26 48 30 35 28 Z" fill="#78909c" stroke="#111111" stroke-width="3.5"/>
    <!-- Serrated Spiked Back -->
    <path d="M29 14 L20 18 L24 22 L18 26 L29 28 Z" fill="#37474f" stroke="#111111" stroke-width="3"/>
    <!-- Dripping Crimson Blood on Edge -->
    <path d="M50 12 C56 16 56 22 52 26" fill="none" stroke="#d50000" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="56" cy="30" r="2.5" fill="#d50000"/>
    <!-- Leather Handle Grip Wrap -->
    <line x1="29" y1="40" x2="35" y2="44" stroke="#d7ccc8" stroke-width="2"/>
    <line x1="29" y1="46" x2="35" y2="50" stroke="#d7ccc8" stroke-width="2"/>
  </g>
</svg>

