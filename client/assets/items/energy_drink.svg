<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Energy Drink Can (+Speed, +Attack Speed) -->
  <g transform="rotate(10 32 32)">
    <!-- Can Cylinder -->
    <rect x="20" y="14" width="24" height="42" rx="4" fill="#00e5ff" stroke="#1a1a1a" stroke-width="4"/>
    <!-- Top Rim -->
    <ellipse cx="32" cy="14" rx="12" ry="4" fill="#cfd8dc" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Tab on top -->
    <rect x="30" y="8" width="4" height="6" rx="1" fill="#90a4ae" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Bottom Rim -->
    <ellipse cx="32" cy="56" rx="12" ry="3" fill="#90a4ae" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Bold Toxic Green Lightning Bolt on Can -->
    <polygon points="34,20 25,34 32,34 30,48 41,32 34,32" fill="#76ff03" stroke="#1a1a1a" stroke-width="2.5"/>
    <!-- Metallic can sheen -->
    <rect x="22" y="18" width="3" height="34" fill="#ffffff" opacity="0.6"/>
    <!-- Fizzing bubbles around can -->
    <circle cx="14" cy="22" r="2.5" fill="#00e5ff" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="48" cy="18" r="2" fill="#76ff03" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="50" cy="30" r="3" fill="#00e5ff" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
</svg>

