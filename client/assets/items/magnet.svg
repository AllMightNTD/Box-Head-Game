<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Horseshoe Magnet (+Pickup Range) -->
  <!-- Magnet Curved Body -->
  <path d="M14 18 V34 C14 44 22 52 32 52 C42 52 50 44 50 34 V18" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="butt"/>
  <path d="M14 18 V34 C14 44 22 52 32 52 C42 52 50 44 50 34 V18" fill="none" stroke="#d32f2f" stroke-width="8" stroke-linecap="butt"/>
  <!-- Left Blue/Silver Pole -->
  <rect x="7" y="10" width="14" height="12" fill="#1976d2" stroke="#1a1a1a" stroke-width="3"/>
  <text x="14" y="20" font-family="sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">S</text>
  <!-- Right Red/Silver Pole -->
  <rect x="43" y="10" width="14" height="12" fill="#e53935" stroke="#1a1a1a" stroke-width="3"/>
  <text x="50" y="20" font-family="sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">N</text>
  <!-- Magnetic Lightning Sparks -->
  <polygon points="26,6 30,12 27,12 31,18 25,18 28,12 25,12" fill="#ffd600" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="38,6 42,12 39,12 43,18 37,18 40,12 37,12" fill="#ffd600" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Glowing green Material gem being sucked in -->
  <polygon points="32,24 38,30 32,36 26,30" fill="#00e676" stroke="#1a1a1a" stroke-width="2"/>
</svg>

