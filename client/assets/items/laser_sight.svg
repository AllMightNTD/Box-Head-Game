<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Military Laser Sight (-Spread, +Crit Chance) [HUMAN] -->
  <!-- Tactical Rail Attachment -->
  <rect x="12" y="32" width="40" height="16" rx="3" fill="#263238" stroke="#111111" stroke-width="4"/>
  <!-- Rail groove clamp -->
  <rect x="18" y="26" width="28" height="8" rx="2" fill="#37474f" stroke="#111111" stroke-width="3"/>
  <circle cx="24" cy="30" r="2" fill="#111111"/>
  <circle cx="40" cy="30" r="2" fill="#111111"/>
  <!-- Laser Emitter Cylinder -->
  <rect x="44" y="35" width="10" height="10" rx="2" fill="#111111" stroke="#111111" stroke-width="2"/>
  <!-- Red Laser Dot Lens -->
  <circle cx="54" cy="40" r="3" fill="#ff1744" stroke="#ffffff" stroke-width="1"/>
  <!-- Beaming Laser Ray -->
  <line x1="56" y1="40" x2="63" y2="40" stroke="#ff1744" stroke-width="3" stroke-linecap="round"/>
  <!-- Crosshair projection -->
  <circle cx="28" cy="14" r="8" fill="none" stroke="#ff1744" stroke-width="2"/>
  <circle cx="28" cy="14" r="2" fill="#ff1744"/>
  <line x1="28" y1="2" x2="28" y2="8" stroke="#ff1744" stroke-width="2"/>
  <line x1="28" y1="20" x2="28" y2="26" stroke="#ff1744" stroke-width="2"/>
  <line x1="16" y1="14" x2="22" y2="14" stroke="#ff1744" stroke-width="2"/>
  <line x1="34" y1="14" x2="40" y2="14" stroke="#ff1744" stroke-width="2"/>
</svg>

