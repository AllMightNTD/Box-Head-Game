<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sniper Scope Crosshair (+Crit Chance) -->
  <!-- Outer lens rim -->
  <circle cx="32" cy="32" r="26" fill="#212121" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Glass lens reflection -->
  <circle cx="32" cy="32" r="22" fill="#00e5ff" fill-opacity="0.25" stroke="#00b0ff" stroke-width="2"/>
  <path d="M16 20 C20 16 28 14 36 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Reticle ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#e53935" stroke-width="2"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <!-- Crosshairs -->
  <line x1="6" y1="32" x2="24" y2="32" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="58" y2="32" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="6" x2="32" y2="24" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="58" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <!-- Center red laser dot -->
  <circle cx="32" cy="32" r="3" fill="#ff1744" stroke="#ffffff" stroke-width="1"/>
  <!-- Range hash marks -->
  <line x1="32" y1="38" x2="36" y2="38" stroke="#e53935" stroke-width="1.5"/>
  <line x1="32" y1="44" x2="38" y2="44" stroke="#e53935" stroke-width="1.5"/>
</svg>

